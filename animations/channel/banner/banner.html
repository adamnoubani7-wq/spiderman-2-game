<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: Poppins; font-weight: 700; src: url(../../trex/web/fonts/Poppins-Bold.ttf); }
body { margin: 0; background: #111; }
canvas { display: block; margin: 0 0 40px; }
</style></head>
<body>
<canvas id="notebook" width="2560" height="1440"></canvas>
<canvas id="bold" width="2560" height="1440"></canvas>
<canvas id="panorama" width="2560" height="1440"></canvas>
<!-- the same drawing engine the Shorts were rendered with -->
<script src="../../trex/web/lib.js"></script><script src="../../trex/web/chars.js"></script><script src="../../trex/web/env.js"></script>
<script src="../../trex/web/env2.js"></script><script src="../../trex/web/env3.js"></script><script src="../../trex/web/env4.js"></script>
<script>
// YouTube: 2560x1440 canvas; phones show only the centre 1546x423 (x 507-2053, y 508-931);
// desktop shows the full-width strip y 508-931; TV shows everything.
const BW = 2560, BH = 1440, SAFE = { x: 507, y: 508, w: 1546, h: 423 };
const INKC = '#221c22', RED = '#d8312b', YELLOW = '#ffe14d', SKY = '#cfeaff';
const HERO = { cols: ['#d8312b', '#d8312b'], vest: '#2f63c9', belt: false, hat: 'mask' };
const YOU = { cols: PAL.blue, hat: 'none', belt: false };
const SCI = { cols: PAL.yellow, hat: 'none', belt: false };

function title(ctx, cx, cy, size, light) {
  // "Stick Science Lab" with a yellow marker behind "Science"
  ctx.font = `700 ${size}px Poppins`; ctx.textBaseline = 'middle';
  const a = 'Stick ', b = 'Science', c = ' Lab';
  const wa = ctx.measureText(a).width, wb = ctx.measureText(b).width, wc = ctx.measureText(c).width;
  let x = cx - (wa + wb + wc) / 2;
  ctx.fillStyle = YELLOW; ctx.save(); ctx.translate(x + wa - 10, cy - size * .38); ctx.rotate(-.012);
  ctx.fillRect(0, 0, wb + 20, size * .78); ctx.restore();
  ctx.textAlign = 'left';
  ctx.lineJoin = 'round';
  for (const [s, w, fill] of [[a, wa, light ? '#fff' : INKC], [b, wb, INKC], [c, wc, light ? '#fff' : INKC]]) { ctx.fillStyle = fill; ctx.fillText(s, x, cy); x += w; }
}
function sub(ctx, cx, cy, size, col, txt) { ctx.font = `700 ${size}px Poppins`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = col; ctx.fillText(txt, cx, cy); }
function pill(ctx, cx, cy, txt, bg, fg) {
  ctx.font = '700 44px Poppins'; const w = ctx.measureText(txt).width + 70;
  ctx.beginPath(); ctx.roundRect(cx - w / 2, cy - 38, w, 76, 38); ctx.fillStyle = bg; ctx.fill(); ctx.lineWidth = 6; ctx.strokeStyle = INKC; ctx.stroke();
  sub(ctx, cx, cy + 2, 44, fg, txt);
}
function grid(ctx, bg, line, step) { ctx.fillStyle = bg; ctx.fillRect(0, 0, BW, BH); ctx.strokeStyle = line; ctx.lineWidth = 2;
  for (let x = 0; x <= BW; x += step) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, BH); ctx.stroke(); }
  for (let y = 0; y <= BH; y += step) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(BW, y); ctx.stroke(); } }
function goggles(ctx, o) { // the icon's scientist goggles, drawn on top of a drawStick figure
  const hy = o.y - .765 * o.s, hr = .19 * o.s;
  line(ctx, o.x - hr, hy - 5, o.x + hr, hy - 5, o.s * .021, INKC);
  for (const k of [-1, 1]) { circle(ctx, o.x + k * .076 * o.s, hy - 5, .061 * o.s); fillStroke(ctx, 'rgba(180,240,255,.35)', o.s * .013); }
}

function drawAll() {
// ---------- A: lab notebook ----------
(function () {
  const ctx = document.getElementById('notebook').getContext('2d');
  grid(ctx, SKY, 'rgba(36,87,201,.12)', 48);
  // TV-only margins: clouds and a spider on its thread
  drawCloud(ctx, 300, 200, 150, 1); drawCloud(ctx, 1300, 160, 120, 2); drawCloud(ctx, 2250, 230, 140, 3);
  line(ctx, 2150, -10, 2150, 300, 6, INKC); drawSpider(ctx, 2150, 340, .45, 0, { smile: true, look: [-.5, .4], wiggle: 0 });
  // desktop strip, left: the masked hero bracing with two webs
  const hero = { ...HERO, x: 300, y: 930, s: 400, arms: { L: [2.4, .2], R: [2.2, .2] }, face: { eyes: 'happy' } };
  webLine(ctx, 300 - 120, 600, -40, 380, 20, 8); webLine(ctx, 300 + 110, 610, 520, 360, 20, 8);
  drawStick(ctx, hero);
  // right: a T. rex peeking in at a startled scientist
  drawRex(ctx, 2430, 930, .62, 0, { jaw: .4, look: -1, flip: -1 });
  const sci = { ...SCI, x: 2120, y: 930, s: 330, arms: { L: [2.6, .2], R: [2.6, .2] }, face: { eyes: 'wide', mouth: 'o', look: [1, 0] } };
  drawStick(ctx, sci); goggles(ctx, sci);
  // phone-safe centre: name, tagline, handle
  title(ctx, BW / 2, 650, 150, false);
  sub(ctx, BW / 2, 790, 60, '#3b3540', 'Real science, explained by stick figures.');
  pill(ctx, BW / 2, 880, '@StickScienceLab', '#fff', INKC);
})();

// ---------- B: bold type on ink ----------
(function () {
  const ctx = document.getElementById('bold').getContext('2d');
  grid(ctx, INKC, 'rgba(255,255,255,.05)', 64);
  const g = ctx.createRadialGradient(BW / 2, BH / 2, 100, BW / 2, BH / 2, 1300); g.addColorStop(0, 'rgba(47,99,201,.35)'); g.addColorStop(1, 'rgba(47,99,201,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, BW, BH);
  sub(ctx, BW / 2, 590, 46, '#9fd0ff', 'MOVIE SCENES · SUPERPOWERS · WILD WHAT-IFS');
  title(ctx, BW / 2, 720, 150, true);
  sub(ctx, BW / 2, 870, 54, '#ffffff', 'Real science, explained by stick figures.');
  // one figure on each side in the desktop strip
  const sci = { ...SCI, x: 330, y: 930, s: 380, arms: { L: [.9, -2.2], R: [2.5, .3] }, face: { eyes: 'happy', mouth: 'grin' } };
  drawStick(ctx, sci); goggles(ctx, sci);
  const hero = { ...HERO, x: 2230, y: 930, s: 380, arms: { L: [.9, -2.2], R: [.9, -2.2] }, face: { eyes: 'normal' } };
  drawStick(ctx, hero);
  sub(ctx, BW / 2, 1270, 40, 'rgba(255,255,255,.55)', '@StickScienceLab');   // TV only
})();

// ---------- C: one continuous world (the three Shorts) ----------
(function () {
  const ctx = document.getElementById('panorama').getContext('2d');
  const sky = ctx.createLinearGradient(0, 0, 0, BH); sky.addColorStop(0, '#4fb0f0'); sky.addColorStop(.75, '#dff3ff'); ctx.fillStyle = sky; ctx.fillRect(0, 0, BW, BH);
  for (const [x, y, s, k] of [[220, 230, 140, 1], [1050, 150, 110, 2], [1900, 220, 130, 3], [2400, 120, 90, 4]]) drawCloud(ctx, x, y, s, k);
  // left third: city and the elevated track (spider-web Short)
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, 900, BH); ctx.clip();
  drawSkyline(ctx, 1000, 4, .8, -200, 1000, .25);
  drawTrack(ctx, 1000, -200, 1000, 0);
  drawCar(ctx, -60, 1000, 460, { front: 1 });
  drawStick(ctx, { ...HERO, x: 380, y: 1000, s: 300, arms: { L: [2.4, .2], R: [2.2, .2] }, face: { eyes: 'squint' } });
  webLine(ctx, 300, 690, 60, 380, 20, 6); webLine(ctx, 460, 690, 480, 360, 20, 6);
  ctx.restore();
  // middle: street (car Short)
  ctx.fillStyle = '#5d5866'; ctx.fillRect(900, 1000, 800, 440); ctx.fillStyle = '#c9c2b6'; ctx.fillRect(900, 960, 800, 40);
  for (let x = 920; x < 1700; x += 200) { ctx.beginPath(); ctx.roundRect(x, 1180, 120, 16, 8); ctx.fillStyle = '#f2e9c9'; ctx.fill(); }
  drawCarSide(ctx, 1300, 1090, .62, { col: '#e9725b' });
  // right third: jungle and the T. rex (T. rex Short)
  ctx.save(); ctx.beginPath(); ctx.rect(1700, 0, 900, BH); ctx.clip();
  ctx.fillStyle = '#7bbf6a'; for (let i = 0; i < 6; i++) { circle(ctx, 1720 + i * 190, 900, 170); ctx.fill(); }
  for (let i = 0; i < 4; i++) drawTree(ctx, 1760 + i * 230, 980, 1.5);
  ctx.fillStyle = '#c99a5e'; ctx.fillRect(1700, 980, 900, 460);
  drawRex(ctx, 2640, 1000, .62, 1.2, { jaw: .6, look: -1, flip: -1 });
  drawStick(ctx, { ...YOU, x: 2160, y: 1000, s: 260, lean: -.2, legs: { L: [.7, -.9], R: [-.5, -.2] }, arms: { L: [1.4, -1.2], R: [.2, -1.2] }, face: { eyes: 'wide', mouth: 'o', look: [1, 0] } });
  ctx.restore();
  // centre card inside the phone-safe area
  ctx.save(); ctx.shadowColor = 'rgba(34,28,34,.25)'; ctx.shadowBlur = 30; ctx.shadowOffsetY = 12;
  ctx.beginPath(); ctx.roundRect(SAFE.x + 40, SAFE.y + 20, SAFE.w - 80, SAFE.h - 40, 48); ctx.fillStyle = '#fffaf0'; ctx.fill(); ctx.restore();
  ctx.beginPath(); ctx.roundRect(SAFE.x + 40, SAFE.y + 20, SAFE.w - 80, SAFE.h - 40, 48); ctx.lineWidth = 10; ctx.strokeStyle = INKC; ctx.stroke();
  title(ctx, BW / 2, 650, 140, false);
  sub(ctx, BW / 2, 775, 56, '#3b3540', 'Real science, explained by stick figures.');
  sub(ctx, BW / 2, 860, 44, '#2457c9', '@StickScienceLab');
})();
}
document.fonts.load('700 100px Poppins').then(() => { drawAll(); document.title = 'ready'; });
</script>
</body></html>
