<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: Poppins; font-weight: 700; src: url(../trex/web/fonts/Poppins-Bold.ttf); }
body { margin: 0; background: #111; }
canvas { display: block; margin: 0 0 40px; }
</style></head>
<body>
<canvas id="logo" width="800" height="800"></canvas>
<canvas id="banner" width="2560" height="1440"></canvas>
<!-- same stick-figure engine as the Shorts -->
<script src="../trex/web/lib.js"></script><script src="../trex/web/chars.js"></script><script src="../trex/web/env.js"></script>
<script src="../trex/web/env2.js"></script><script src="../trex/web/env3.js"></script>
<script>
// Stickonomics brand: money green, gold, ink, paper
const GREEN = '#1f8a4c', GREEN_D = '#0f5a32', MINT = '#d9f3e2', GOLD = '#f5c542', GOLD_D = '#c9971c', INKC = '#221c22';
const BW = 2560, BH = 1440, SAFE = { x: 507, y: 508, w: 1546, h: 423 };

function coin(ctx, x, y, r, tilt = 0) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(tilt);
  ellipse(ctx, 0, r * .12, r, r); fillStroke(ctx, GOLD_D, r * .09);          // rim / thickness
  circle(ctx, 0, 0, r); fillStroke(ctx, GOLD, r * .09);
  circle(ctx, 0, 0, r * .74); ctx.lineWidth = r * .05; ctx.strokeStyle = GOLD_D; ctx.stroke();
  ctx.font = `700 ${r * 1.05}px Poppins`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = GOLD_D; ctx.fillText('$', 0, r * .06);
  ctx.fillStyle = 'rgba(255,255,255,.35)'; ellipse(ctx, -r * .35, -r * .45, r * .28, r * .12, -.6); ctx.fill();
  ctx.restore();
}
function stack(ctx, x, base, n, r) { for (let i = 0; i < n; i++) { ctx.save(); ctx.translate(x, base - i * r * .34);
  ellipse(ctx, 0, 0, r, r * .32); fillStroke(ctx, i % 2 ? GOLD : '#f7d36a', r * .08); ctx.restore(); } }
function arrowUp(ctx, pts, w, col) { // zig-zag growth line ending in an arrow head
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  for (const [c, lw] of [[INKC, w + 14], [col, w]]) { path(ctx, pts, false); ctx.lineWidth = lw; ctx.strokeStyle = c; ctx.stroke(); }
  const [a, b] = [pts[pts.length - 2], pts[pts.length - 1]], ang = Math.atan2(b[1] - a[1], b[0] - a[0]), h = w * 2.2;
  ctx.save(); ctx.translate(b[0], b[1]); ctx.rotate(ang); path(ctx, [[h * .9, 0], [-h * .5, -h * .75], [-h * .5, h * .75]]); fillStroke(ctx, col, 7); ctx.restore();
}

function drawAll() {
  // ---------- logo 800x800 (YouTube crops it to a circle) ----------
  (function () {
    const ctx = document.getElementById('logo').getContext('2d');
    const g = ctx.createRadialGradient(400, 320, 60, 400, 400, 560); g.addColorStop(0, '#3fbf74'); g.addColorStop(1, GREEN_D);
    ctx.fillStyle = g; ctx.fillRect(0, 0, 800, 800);
    // faint graph-paper grid + rising line behind
    ctx.strokeStyle = 'rgba(255,255,255,.08)'; ctx.lineWidth = 2;
    for (let i = 0; i <= 800; i += 50) { ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, 800); ctx.stroke(); ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(800, i); ctx.stroke(); }
    arrowUp(ctx, [[60, 560], [210, 470], [300, 510], [470, 330], [560, 370], [700, 170]], 26, GOLD);
    // stick figure bust, grinning, holding a big coin
    drawStick(ctx, { x: 360, y: 1220, s: 1000, cols: ['#2f63c9', '#2f63c9'], hat: 'none', belt: false, shadow: false,
      arms: { L: [.3, -.1], R: [.3, -.1] }, face: { eyes: 'happy', mouth: 'grin', look: [.4, -.2] } });
    coin(ctx, 590, 560, 140, .12);
  })();

  // ---------- banner 2560x1440 ----------
  (function () {
    const ctx = document.getElementById('banner').getContext('2d');
    ctx.fillStyle = MINT; ctx.fillRect(0, 0, BW, BH);
    ctx.strokeStyle = 'rgba(15,90,50,.10)'; ctx.lineWidth = 2;
    for (let x = 0; x <= BW; x += 48) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, BH); ctx.stroke(); }
    for (let y = 0; y <= BH; y += 48) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(BW, y); ctx.stroke(); }
    // TV-only margins: a long growth line across the top, coins scattered low
    arrowUp(ctx, [[80, 380], [400, 300], [620, 340], [1000, 200], [1300, 240], [1700, 120], [2000, 160], [2420, 60]], 18, GREEN);
    for (const [x, y, r, t] of [[260, 1220, 70, -.2], [700, 1300, 55, .3], [1900, 1280, 60, .15], [2320, 1200, 75, -.1]]) coin(ctx, x, y, r, t);
    // desktop strip, left: a young saver with a small coin stack
    stack(ctx, 430, 925, 3, 60);
    drawStick(ctx, { x: 250, y: 930, s: 360, cols: ['#2f63c9', '#2f63c9'], hat: 'none', belt: false, arms: { L: [.3, -.1], R: [1.2, -.6] }, face: { eyes: 'normal', mouth: 'smile', look: [1, 0] } });
    // right: the same saver years later, a tall stack, celebrating
    stack(ctx, 2140, 925, 9, 60);
    drawStick(ctx, { x: 2330, y: 930, s: 360, cols: ['#2f63c9', '#2f63c9'], hat: 'none', belt: false, arms: { L: [2.6, .2], R: [2.6, .2] }, face: { eyes: 'happy', mouth: 'grin' } });
    // phone-safe centre: name, tagline, handle
    ctx.textBaseline = 'middle';
    ctx.font = '700 170px Poppins'; const a = 'Stick', b = 'onomics'; const wa = ctx.measureText(a).width, wb = ctx.measureText(b).width;
    let x = BW / 2 - (wa + wb) / 2, cy = 640;
    ctx.fillStyle = GOLD; ctx.save(); ctx.translate(x + wa - 8, cy - 64); ctx.rotate(-.012); ctx.fillRect(0, 0, wb + 22, 132); ctx.restore();
    ctx.textAlign = 'left'; ctx.fillStyle = INKC; ctx.fillText(a, x, cy); ctx.fillText(b, x + wa, cy);
    ctx.textAlign = 'center'; ctx.font = '700 60px Poppins'; ctx.fillStyle = GREEN_D; ctx.fillText('Money explained by stick figures.', BW / 2, 790);
    ctx.font = '700 44px Poppins'; const h = '@Stickonomics', hw = ctx.measureText(h).width + 70;
    ctx.beginPath(); ctx.roundRect(BW / 2 - hw / 2, 842, hw, 76, 38); ctx.fillStyle = '#fff'; ctx.fill(); ctx.lineWidth = 6; ctx.strokeStyle = INKC; ctx.stroke();
    ctx.fillStyle = INKC; ctx.fillText(h, BW / 2, 882);
  })();
}
document.fonts.load('700 100px Poppins').then(() => { drawAll(); document.title = 'ready'; });
</script>
</body></html>
